services:
  database:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: paperdeck_test
      POSTGRES_PASSWORD: paperdeck_local_only
      POSTGRES_USER: paperdeck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperdeck -d paperdeck_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${PAPERDECK_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - paperdeck_postgres_data:/var/lib/postgresql/data

volumes:
  paperdeck_postgres_data:
