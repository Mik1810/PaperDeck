name: App CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: paperdeck_test
          POSTGRES_PASSWORD: paperdeck_local_only
          POSTGRES_USER: paperdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperdeck -d paperdeck_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_replace_me' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_replace_me' }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /feed
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /onboarding
      DATABASE_URL: postgresql://paperdeck:paperdeck_local_only@127.0.0.1:5432/paperdeck_test
      PAPERDECK_TEST_DATABASE_URL: postgresql://paperdeck:paperdeck_local_only@127.0.0.1:5432/paperdeck_test
      DATABASE_MAX_CONNECTIONS: "3"
      NEXT_PUBLIC_PAPERDECK_DEV_AUTH: "true"
      PAPERDECK_E2E_DEV_AUTH: "true"
      PAPERDECK_E2E_OWNER_ID: playwright-user-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit service-role boundaries
        run: npm run audit:service-role

      - name: Lint
        run: npm run lint

      - name: Deterministic recommendation stability gate
        id: recommendation_stability
        run: npm run evaluate:recommendations

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Isolated Playwright smoke tests
        run: npm run test:e2e

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## App CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| service-role audit | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| deterministic recommendation stability | \`${{ steps.recommendation_stability.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| e2e smoke tests | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "*Job status: \`${{ job.status }}\`.*" >> "$GITHUB_STEP_SUMMARY"
